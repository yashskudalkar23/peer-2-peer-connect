<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2E5D39" />
  <meta name="color-scheme" content="light only" />
  <title>Connect — Grow together</title>
  <meta name="description" content="Connect pairs college students with peers who recently cleared what they're learning — matched by subject, confidence, language, format and free days." />

  <!-- Poppins (friendly headings/logo) + Inter (clean body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app" data-chrome="bare">

    <!-- ===== Sidebar (desktop) ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo-mark" aria-hidden="true"><i class="c1"></i><i class="c2"></i></span>
        <span class="logo-word">Connect</span>
      </div>
      <p class="brand-tag">Grow together</p>

      <nav class="nav" id="navList" aria-label="Main navigation"></nav>

      <div class="side-foot">
        <button class="side-link" id="jumpBtnSide">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Jump to a screen</span>
        </button>
        <p class="side-note">Clickable demo · sample data · resets on reload</p>
      </div>
    </aside>

    <!-- ===== Main column ===== -->
    <div class="main" id="main">
      <header class="topbar" id="apphead" hidden>
        <button class="hd-back" id="hdBack" aria-label="Go back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="hd-titles">
          <div class="hd-title" id="hdTitle">Title</div>
          <div class="hd-sub" id="hdSub" hidden></div>
        </div>
        <div class="hd-action" id="hdAction"></div>
        <button class="hd-jump" id="jumpBtnTop" aria-label="Jump to a screen (demo)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </header>

      <main class="screen" id="screen" tabindex="-1"></main>

      <!-- Mobile bottom nav -->
      <nav class="bottomnav" id="tabbar" aria-label="Main navigation" hidden></nav>
    </div>

    <!-- Bottom sheet -->
    <div class="sheet-wrap" id="sheetWrap" hidden>
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Sheet"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
